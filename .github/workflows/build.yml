# 构建并发布 rpk。
#
# AstroForge 用 `device-width` 自动适应不同屏宽，因此 s3/s4/rw5 共用一份产物，
# 不再像旧版那样跑两个 python 脚本。release 与 debug 分别按 HB_RELEASE 翻转 manifest。

name: build-rpk

on:
  push:
    branches:
      - g3
      - next-gen
  pull_request:
    branches:
      - g3
      - next-gen
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: true

      - name: 生成 GIF 资源
        run: pnpm build:gifs

      - name: 构建 debug rpk
        env:
          HB_RELEASE: "0"
        run: pnpm build

      - name: 上传 debug rpk
        uses: actions/upload-artifact@v4
        with:
          name: hyperbilibili-debug
          path: dist/**/*.rpk

      - name: 构建 release rpk
        env:
          HB_RELEASE: "1"
        run: pnpm release

      - name: 上传 release rpk
        uses: actions/upload-artifact@v4
        with:
          name: hyperbilibili-release
          path: dist/**/*.rpk
